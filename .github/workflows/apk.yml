name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Preparar carpeta www
        run: |
          mkdir www
          rsync -a --exclude='.git' --exclude='www' --exclude='tools' --exclude='docs' --exclude='.github' ./ www/
      - name: Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init PokeSurvivor com.jpter78.pokesurvivor --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk